[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:clamd]
command=/usr/sbin/clamd --foreground=true --config-file=/etc/clamav/clamd.conf
user=clamav
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=12
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:freshclam]
command=/usr/bin/freshclam --daemon --foreground=true --config-file=/etc/clamav/freshclam.conf
user=clamav
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=12
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=/usr/local/bin/start-api
user=xai
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=12
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
