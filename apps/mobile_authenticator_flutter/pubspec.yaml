name: xai_compress_authenticator
description: XAI-Compress mobile authenticator with TOTP, QR enrollment, secure storage and biometric lock.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  otp: ^3.1.4
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^7.0.1
  local_auth: ^2.3.0
  http: ^1.4.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
